name: Огляд архітектури

# Раз на тиждень агент шукає одну можливість поглибити модуль
# і пропонує її як задачу з міткою source:architecture-review.
# Агент лише читає код і задачі; створює задачу окремий крок workflow.

on:
  schedule:
    # Понеділок, 07:00 UTC. GitHub може запустити із затримкою.
    - cron: "0 7 * * 1"
  workflow_dispatch:

env:
  LABEL: source:architecture-review
  # Якщо відкритих пропозицій стільки або більше - новий запуск пропускається.
  BACKLOG_LIMIT: 3

jobs:
  check-backlog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: read
    outputs:
      proceed: ${{ steps.count.outputs.proceed }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Порахувати відкриті пропозиції
        id: count
        run: |
          set -euo pipefail
          open=$(gh issue list --state open --label "$LABEL" --limit "$BACKLOG_LIMIT" --json number --jq 'length')
          echo "Відкритих пропозицій '$LABEL': $open (рахуємо до $BACKLOG_LIMIT)."
          if [ "$open" -lt "$BACKLOG_LIMIT" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "Відкритих пропозицій уже $BACKLOG_LIMIT або більше - цей запуск пропущено." >> "$GITHUB_STEP_SUMMARY"
          fi

  review:
    needs: check-backlog
    if: needs.check-backlog.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: architecture-review
      cancel-in-progress: false
    permissions:
      contents: read
      issues: read
    outputs:
      result: ${{ steps.agent.outputs.structured_output }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Агент шукає одну пропозицію
        id: agent
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Репозиторій: ${{ github.repository }}.
            Прочитай файл .github/prompts/architecture-review.md і виконай його.
          claude_args: |
            --model claude-opus-5-5
            --allowedTools "Read,Glob,Grep,Agent,Bash(gh issue list:*),Bash(gh issue view:*),Bash(git log:*)"
            --json-schema '{"type":"object","additionalProperties":false,"required":["status"],"properties":{"status":{"type":"string","enum":["proposed","skipped"]},"title":{"type":"string","minLength":1,"maxLength":256},"body":{"type":"string","minLength":1},"summary":{"type":"string","minLength":1},"candidates":{"type":"array","minItems":1,"items":{"type":"string","minLength":1}},"reason":{"type":"string","minLength":1}}}'

  publish:
    needs: review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RESULT: ${{ needs.review.outputs.result }}
    steps:
      - name: Створити задачу й підсумок
        run: |
          set -euo pipefail
          if [ -z "$RESULT" ]; then
            echo "Агент не повернув відповіді." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          status=$(jq -r '.status' <<< "$RESULT")

          if [ "$status" = "skipped" ]; then
            {
              echo "## Огляд архітектури: нічого нового"
              echo ""
              jq -r '.reason // "Причину не вказано."' <<< "$RESULT"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$status" != "proposed" ] \
            || ! jq -e '(.title | length > 0) and (.body | length > 0) and (.summary | length > 0) and (.candidates | length > 0)' <<< "$RESULT" > /dev/null; then
            {
              echo "Неповна відповідь агента:"
              echo '```json'
              echo "$RESULT"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          gh label create "$LABEL" \
            --color "5319E7" \
            --description "Пропозиції щотижневого огляду архітектури" \
            >/dev/null 2>&1 || true

          title=$(jq -r '.title' <<< "$RESULT")
          jq -r '.body' <<< "$RESULT" > "$RUNNER_TEMP/body.md"
          issue_url=$(gh issue create \
            --title "$title" \
            --body-file "$RUNNER_TEMP/body.md" \
            --label "$LABEL" \
            --label "needs-triage" | tail -n1)

          {
            echo "## Огляд архітектури"
            echo ""
            echo "**Створено:** [$title]($issue_url)"
            echo ""
            jq -r '.summary' <<< "$RESULT"
            echo ""
            echo "### Розглянуті кандидати"
            jq -r '.candidates[] | "- \(.)"' <<< "$RESULT"
          } >> "$GITHUB_STEP_SUMMARY"
